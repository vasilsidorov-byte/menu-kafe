<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Казка здорового харчування</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #f0fdf8 0%, #e8f5e9 50%, #f3e8ff 100%);
  }

  #app {
    font-family: 'Nunito', sans-serif;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* ─── LANDING ─── */
  #landing {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(12px, 3vw, 24px);
    width: 100%; height: 100%;
    padding: 0 1rem 1rem 1rem;
    justify-content: flex-start;
  }

  .tagline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.7rem, 7vw, 2.2rem);
    color: #3B6D11;
    letter-spacing: .03em;
  }

  .round-btn {
    width: clamp(240px, 68vw, 340px);
    height: clamp(240px, 68vw, 340px);
    border-radius: 50%; border: none; cursor: pointer;
    padding: 6px;
    background: conic-gradient(#1D9E75,#63BE46,#EF9F27,#D85A30,#378ADD,#993556,#9E6B10,#29A886,#1D9E75);
    box-shadow: 0 8px 40px rgba(29,158,117,.45), 0 0 0 3px rgba(255,255,255,.3);
    transition: transform .2s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .round-btn:active { transform: scale(.95); }

  .round-btn-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #f5fffb, #c8f0e2 55%, #9fdecb);
    display: flex; align-items: center; justify-content: center;
    padding: 1.4rem;
  }
  .round-btn-inner span {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(1.9rem, 7.6vw, 2.5rem);
    color: #064a38;
    line-height: 1.4; text-align: center;
  }

  .hint {
    font-size: clamp(1.5rem, 5.6vw, 1.8rem);
    color: #5a7a6a;
  }

  /* ─── WHEEL VIEW ─── */
  #wheel-view {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(8px, 2vw, 14px);
    width: 100%; height: 100%;
    padding: 0 1rem 1rem 1rem;
    justify-content: flex-start;
  }

  #wheel-wrap {
    position: relative;
    width: clamp(300px, 90vw, 500px);
    height: clamp(300px, 90vw, 500px);
  }

  #wc { display: block; width: 100%; height: 100%; }

  #pin {
    position: absolute;
    top: -2%;
    left: 50%; transform: translateX(-50%);
    z-index: 10;
    width: 7%;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
  }

  #spin-btn {
    background: linear-gradient(135deg, #D85A30, #EF9F27);
    color: #fff; border: none; border-radius: 50px;
    padding: clamp(.6rem,2.4vw,.8rem) clamp(1.4rem,5.6vw,2.4rem);
    font-size: clamp(1.5rem, 6.4vw, 1.85rem);
    font-family: 'Nunito', sans-serif; font-weight: 900;
    cursor: pointer; letter-spacing: .04em;
    box-shadow: 0 4px 20px rgba(216,90,48,.4);
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s;
  }
  #spin-btn:active:not(:disabled) { transform: scale(.95); }
  #spin-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ─── MODAL ─── */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); z-index: 100;
    align-items: center; justify-content: center;
    padding: 1rem;
  }
  #modal {
    background: #fff; border-radius: 28px;
    padding: clamp(1.5rem,5vw,2.5rem) clamp(1.2rem,4vw,2rem) clamp(1.2rem,4vw,2rem);
    max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
    animation: pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from{transform:scale(.4) rotate(-10deg);opacity:0} to{transform:none;opacity:1} }
  #modal-emoji { font-size: clamp(5rem, 20vw, 7rem); margin-bottom: .5rem; }
  #modal-sector { font-size: 1.5rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #888; margin-bottom: .2rem; }
  #modal-title { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 9vw, 2.8rem); color: #1a1a1a; margin-bottom: .5rem; }
  #modal-text { color: #555; font-size: clamp(1.7rem, 7vw, 1.9rem); line-height: 1.65; margin-bottom: 1.5rem; }
  .btn-close {
    background: linear-gradient(135deg,#1D9E75,#3B6D11); color: #fff;
    border: none; border-radius: 50px;
    padding: .75rem 2.2rem; font-size: 1.9rem;
    font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer;
  }
</style>
</head>

<script>
const S=[
  {label:'Овочі',     emoji:'🥦', color:'#0F6E56', light:'#b8ede0', title:'Час для зелені!',       msg:'тест'},
  {label:'Фрукти',    emoji:'🍎', color:'#3B7D11', light:'#d4f7b5', title:'Соковитий день!',        msg:'тест'},
  {label:'Злаки',     emoji:'🌾', color:'#BA7517', light:'#fdebc0', title:'Енергія зернових',       msg:'тест'},
  {label:'Білки',     emoji:'🥚', color:'#993C1D', light:'#fdd0b5', title:'Сила білка!',            msg:'тест'},
  {label:'Вода',      emoji:'💧', color:'#185FA5', light:'#cce3f8', title:'Живлюща вода',           msg:'тест'},
  {label:'Горіхи',    emoji:'🥜', color:'#7A4A08', light:'#f5dfa8', title:'Жменька здоров\'я',      msg:'тест'},
  {label:'Молочне',   emoji:'🥛', color:'#0F6E56', light:'#d0f5ec', title:'Кальцій для сили',       msg:'тест'},
  {label:'Суперфуди', emoji:'✨', color:'#6B1E52', light:'#f2c4e5', title:'Магія суперїжі!',        msg:'тест'},
  {label:'Ягоди',     emoji:'🍇', color:'#4A2080', light:'#e0d0fc', title:'Антиоксиданти!',         msg:'тест'},
  {label:'Зелень',    emoji:'🌿', color:'#1A6B2A', light:'#c5f0c8', title:'Хлорофіл — сила!',      msg:'тест'},
  {label:'Риба',      emoji:'🐟', color:'#0D5A8A', light:'#c0dff5', title:'Омега-3 у дії',          msg:'тест'},
  {label:'Яйця',      emoji:'🍳', color:'#9E5010', light:'#fde5c0', title:'Ідеальний сніданок',     msg:'тест'},
  {label:'Бобові',    emoji:'🫘', color:'#5A6B10', light:'#e8f0b0', title:'Клітковина і білок',     msg:'тест'},
  {label:'Прянощі',   emoji:'🌶️', color:'#8A1515', light:'#fac8c8', title:'Смачно та корисно!',    msg:'тест'},
  {label:'Олія',      emoji:'🫒', color:'#3D6B05', light:'#d8f0a0', title:'Корисні жири',           msg:'тест'},
  {label:'Чай',       emoji:'🍵', color:'#3B5A2A', light:'#d5edc0', title:'Зелений ритуал',         msg:'тест'},
];

const canvas = document.getElementById('wc');
const ctx = canvas.getContext('2d');
const n = S.length;
const arc = (2 * Math.PI) / n;
let curAngle = 0, spinning = false;
let SIZE = 360;

function resize() {
  const wrap = document.getElementById('wheel-wrap');
  SIZE = wrap.offsetWidth;
  canvas.width = SIZE;
  canvas.height = SIZE;
  drawWheel(curAngle);
}

function drawWheel(angle) {
  const cx = SIZE/2, cy = SIZE/2, R = SIZE/2 * 0.93, rIn = SIZE/2 * 0.34;
  ctx.clearRect(0, 0, SIZE, SIZE);

  // outer rings
  [R+7, R+3].forEach((rad, i) => {
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,2*Math.PI);
    ctx.strokeStyle = i===0 ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.3)';
    ctx.lineWidth = i===0 ? 7 : 3.5; ctx.stroke();
  });

  // tick marks
  for(let i=0;i<n;i++){
    const a = angle+i*arc-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(R+2), cy+Math.sin(a)*(R+2));
    ctx.lineTo(cx+Math.cos(a)*(R+10), cy+Math.sin(a)*(R+10));
    ctx.strokeStyle = 'rgba(255,215,80,.75)';
    ctx.lineWidth = 1.8; ctx.stroke();
  }

  S.forEach((s, i) => {
    const start = angle+i*arc-Math.PI/2;
    const end = start+arc;
    const mid = start+arc/2;

    ctx.beginPath();
    ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,start,end); ctx.closePath();
    const grd = ctx.createRadialGradient(cx,cy,rIn,cx,cy,R);
    grd.addColorStop(0, s.light);
    grd.addColorStop(.55, s.color);
    grd.addColorStop(1, darken(s.color,.7));
    ctx.fillStyle = grd; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,start,end); ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.beginPath(); ctx.arc(cx,cy,R-5,start+.04,end-.04);
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 6; ctx.stroke();

    const tr = R*0.64;
    const ex = cx+Math.cos(mid)*tr;
    const ey = cy+Math.sin(mid)*tr;
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(mid+Math.PI/2);

    const fs = Math.round(SIZE * 0.032);
    const pillW = SIZE*0.19, pillH = SIZE*0.053, pillR = pillH/2;
    ctx.beginPath();
    ctx.roundRect(-pillW/2, pillH*0.15, pillW, pillH, pillR);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = `700 ${fs}px Nunito,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.label, 0, pillH*0.65);

    ctx.font = `${Math.round(SIZE*0.048)}px serif`;
    ctx.fillText(s.emoji, 0, -SIZE*0.04);
    ctx.restore();
  });

  // starburst center
  for(let i=0;i<16;i++){
    const a = angle+i*(Math.PI/8);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rIn,a,a+Math.PI/16); ctx.closePath();
    ctx.fillStyle = i%2===0?'rgba(255,220,60,.2)':'rgba(255,255,255,.07)'; ctx.fill();
  }
  const cg = ctx.createRadialGradient(cx-SIZE*.05,cy-SIZE*.05,2,cx,cy,rIn);
  cg.addColorStop(0,'#fffbe8'); cg.addColorStop(.6,'#d4f5e8'); cg.addColorStop(1,'#9fdecb');
  ctx.beginPath(); ctx.arc(cx,cy,rIn,0,2*Math.PI);
  ctx.fillStyle=cg; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2.5; ctx.stroke();

  // draw logo in center
  if(window._collegeLogo && window._collegeLogo.complete){
    const logoSize = rIn*2.0;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,rIn,0,2*Math.PI); ctx.clip();
    // use imageSmoothingQuality for crispness
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(window._collegeLogo, cx-logoSize/2, cy-logoSize/2, logoSize, logoSize);
    ctx.restore();
  } else {
    ctx.font = `${Math.round(SIZE*0.07)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🍀',cx,cy);
  }
}

function darken(hex,f){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function startWheel(){
  document.getElementById('landing').style.display='none';
  const wv=document.getElementById('wheel-view');
  wv.style.display='flex';
  resize();
}

function spin(){
  if(spinning)return;
  spinning=true;
  document.getElementById('spin-btn').disabled=true;
  const extra=(7+Math.floor(Math.random()*5))*2*Math.PI;
  const target=Math.random()*2*Math.PI;
  const total=extra+target;
  const dur=5000; const t0=performance.now(); const a0=curAngle;
  function frame(now){
    const el=Math.min(now-t0,dur);
    const ease=1-Math.pow(1-el/dur,4);
    drawWheel(a0+total*ease);
    if(el<dur){requestAnimationFrame(frame);}
    else{
      curAngle=(a0+total)%(2*Math.PI);
      drawWheel(curAngle); spinning=false;
      setTimeout(()=>showResult(curAngle),350);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(angle){
  const norm=(((-angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI));
  const idx=Math.floor(norm/arc)%n;
  const s=S[idx];
  document.getElementById('modal-emoji').textContent=s.emoji;
  document.getElementById('modal-sector').textContent=s.label;
  document.getElementById('modal-title').textContent=s.title;
  document.getElementById('modal-text').textContent=s.msg;
  document.getElementById('overlay').style.display='flex';
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('spin-btn').disabled=false;
}

// preload logo
