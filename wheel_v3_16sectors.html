
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
#app{font-family:'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:560px;padding:2rem 1rem}
#landing{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.tagline{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:var(--color-text-secondary)}
.round-btn{width:220px;height:220px;border-radius:50%;border:none;cursor:pointer;padding:5px;position:relative;background:conic-gradient(#1D9E75,#63BE46,#EF9F27,#D85A30,#378ADD,#993556,#9E6B10,#29A886,#1D9E75);box-shadow:0 8px 40px rgba(29,158,117,.5),0 0 0 3px rgba(255,255,255,.15);transition:transform .2s,box-shadow .2s}
.round-btn:hover{transform:scale(1.07) rotate(6deg);box-shadow:0 14px 55px rgba(29,158,117,.6),0 0 0 4px rgba(255,255,255,.25)}
.round-btn:active{transform:scale(.96)}
.round-btn-inner{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 35%,#f0fdf8,#c8f0e2 55%,#9fdecb);display:flex;align-items:center;justify-content:center;padding:1.1rem}
.round-btn-inner span{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:#064a38;line-height:1.38;text-align:center}
.hint{font-size:.78rem;color:var(--color-text-secondary)}
#wheel-view{display:none;flex-direction:column;align-items:center;gap:1.2rem}
#wheel-wrap{position:relative;width:360px;height:360px}
#pin{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:10;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
#spin-btn{background:linear-gradient(135deg,#D85A30,#EF9F27);color:#fff;border:none;border-radius:50px;padding:.85rem 2.4rem;font-size:1rem;font-family:'Nunito',sans-serif;font-weight:900;cursor:pointer;letter-spacing:.04em;box-shadow:0 4px 20px rgba(216,90,48,.4);transition:transform .15s}
#spin-btn:hover:not(:disabled){transform:translateY(-2px)}
#spin-btn:disabled{opacity:.4;cursor:not-allowed}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center}
#modal{background:var(--color-background-primary);border-radius:28px;padding:2.4rem 2rem 2rem;max-width:310px;width:90%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
#modal-emoji{font-size:3.2rem;margin-bottom:.5rem}
#modal-sector{font-size:.75rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:.2rem}
#modal-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--color-text-primary);margin-bottom:.5rem}
#modal-text{color:var(--color-text-secondary);font-size:.9rem;line-height:1.65;margin-bottom:1.5rem}
.btn-close{background:linear-gradient(135deg,#1D9E75,#3B6D11);color:#fff;border:none;border-radius:50px;padding:.72rem 2.2rem;font-size:.95rem;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer}
</style>

<div id="app">
  <div id="landing">
    <div class="tagline">Твій помічник у світі їжі</div>
    <button class="round-btn" onclick="startWheel()" aria-label="Поринути в казку здорового харчування">
      <div class="round-btn-inner">
        <span>Поринути в казку здорового харчування</span>
      </div>
    </button>
    <div class="hint">Натисни та отримай пораду дня ✨</div>
  </div>
  <div id="wheel-view">
    <div id="wheel-wrap">
      <svg id="pin" width="30" height="42" viewBox="0 0 30 42">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF7A45"/>
            <stop offset="100%" stop-color="#C0390A"/>
          </linearGradient>
        </defs>
        <polygon points="15,40 1,5 29,5" fill="url(#pg)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="15" cy="5" r="5.5" fill="url(#pg)" stroke="#fff" stroke-width="2"/>
      </svg>
      <canvas id="wc" width="360" height="360"></canvas>
    </div>
    <button id="spin-btn" onclick="spin()">🎲 Крутити колесо!</button>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <div id="modal-emoji"></div>
    <div id="modal-sector"></div>
    <div id="modal-title"></div>
    <div id="modal-text"></div>
    <button class="btn-close" onclick="closeModal()">Чудово, дякую!</button>
  </div>
</div>

<script>
const S=[
  {label:'Овочі',     emoji:'🥦', color:'#0F6E56', light:'#b8ede0', title:'Час для зелені!',      msg:'тест'},
  {label:'Фрукти',    emoji:'🍎', color:'#3B7D11', light:'#d4f7b5', title:'Соковитий день!',       msg:'тест'},
  {label:'Злаки',     emoji:'🌾', color:'#BA7517', light:'#fdebc0', title:'Енергія зернових',      msg:'тест'},
  {label:'Білки',     emoji:'🥚', color:'#993C1D', light:'#fdd0b5', title:'Сила білка!',           msg:'тест'},
  {label:'Вода',      emoji:'💧', color:'#185FA5', light:'#cce3f8', title:'Живлюща вода',          msg:'тест'},
  {label:'Горіхи',    emoji:'🥜', color:'#7A4A08', light:'#f5dfa8', title:'Жменька здоров\'я',     msg:'тест'},
  {label:'Молочне',   emoji:'🥛', color:'#0F6E56', light:'#d0f5ec', title:'Кальцій для сили',      msg:'тест'},
  {label:'Суперфуди', emoji:'✨', color:'#6B1E52', light:'#f2c4e5', title:'Магія суперїжі!',       msg:'тест'},
  {label:'Ягоди',     emoji:'🍇', color:'#4A2080', light:'#e0d0fc', title:'Антиоксиданти!',        msg:'тест'},
  {label:'Зелень',    emoji:'🌿', color:'#1A6B2A', light:'#c5f0c8', title:'Хлорофіл — сила!',     msg:'тест'},
  {label:'Риба',      emoji:'🐟', color:'#0D5A8A', light:'#c0dff5', title:'Омега-3 у дії',         msg:'тест'},
  {label:'Яйця',      emoji:'🍳', color:'#9E5010', light:'#fde5c0', title:'Ідеальний сніданок',    msg:'тест'},
  {label:'Бобові',    emoji:'🫘', color:'#5A6B10', light:'#e8f0b0', title:'Клітковина і білок',    msg:'тест'},
  {label:'Прянощі',   emoji:'🌶️', color:'#8A1515', light:'#fac8c8', title:'Смачно та корисно!',   msg:'тест'},
  {label:'Олія',      emoji:'🫒', color:'#3D6B05', light:'#d8f0a0', title:'Корисні жири',         msg:'тест'},
  {label:'Чай',       emoji:'🍵', color:'#3B5A2A', light:'#d5edc0', title:'Зелений ритуал',       msg:'тест'},
];

const canvas=document.getElementById('wc');
const ctx=canvas.getContext('2d');
const n=S.length;
const arc=(2*Math.PI)/n;
const cx=180,cy=180,R=168,rIn=48;
let curAngle=0,spinning=false;

function drawWheel(angle){
  ctx.clearRect(0,0,360,360);

  // decorative outer rings
  [R+14,R+8].forEach((rad,i)=>{
    ctx.beginPath();
    ctx.arc(cx,cy,rad,0,2*Math.PI);
    ctx.strokeStyle=i===0?'rgba(255,255,255,.12)':'rgba(255,255,255,.25)';
    ctx.lineWidth=i===0?8:4;
    ctx.stroke();
  });

  // gold tick marks on outer ring
  for(let i=0;i<n;i++){
    const a=angle+i*arc-Math.PI/2;
    const x1=cx+Math.cos(a)*(R+6);
    const y1=cy+Math.sin(a)*(R+6);
    const x2=cx+Math.cos(a)*(R+16);
    const y2=cy+Math.sin(a)*(R+16);
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle='rgba(255,215,80,.7)';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  S.forEach((s,i)=>{
    const start=angle+i*arc-Math.PI/2;
    const end=start+arc;
    const mid=start+arc/2;

    // sector
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,start,end);
    ctx.closePath();
    const grd=ctx.createRadialGradient(cx,cy,rIn,cx,cy,R);
    grd.addColorStop(0,s.light);
    grd.addColorStop(.55,s.color);
    grd.addColorStop(1,darken(s.color,.7));
    ctx.fillStyle=grd;
    ctx.fill();

    // separator line
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(start)*rIn,cy+Math.sin(start)*rIn);
    ctx.lineTo(cx+Math.cos(start)*R,cy+Math.sin(start)*R);
    ctx.strokeStyle='rgba(255,255,255,.5)';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // shine arc near outer edge
    ctx.beginPath();
    ctx.arc(cx,cy,R-6,start+.04,end-.04);
    ctx.strokeStyle='rgba(255,255,255,.18)';
    ctx.lineWidth=5;
    ctx.stroke();

    // text area
    const tr=R*0.63;
    const ex=cx+Math.cos(mid)*tr;
    const ey=cy+Math.sin(mid)*tr;
    ctx.save();
    ctx.translate(ex,ey);
    ctx.rotate(mid+Math.PI/2);

    // pill bg
    ctx.beginPath();
    if(ctx.roundRect){ctx.roundRect(-34,2,68,18,9);}
    else{roundRectFallback(ctx,-34,2,68,18,9);}
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.fill();

    ctx.fillStyle='#fff';
    ctx.font='700 11px Nunito,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(s.label,0,11);

    // emoji
    ctx.font='16px serif';
    ctx.fillText(s.emoji,0,-9);

    ctx.restore();
  });

  // center disc with star burst
  for(let i=0;i<16;i++){
    const a=angle+i*(Math.PI/8);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rIn,a,a+Math.PI/16);
    ctx.closePath();
    ctx.fillStyle=i%2===0?'rgba(255,220,60,.25)':'rgba(255,255,255,.08)';
    ctx.fill();
  }
  const cg=ctx.createRadialGradient(cx-10,cy-10,2,cx,cy,rIn);
  cg.addColorStop(0,'#fffbe8');
  cg.addColorStop(.6,'#d4f5e8');
  cg.addColorStop(1,'#9fdecb');
  ctx.beginPath();
  ctx.arc(cx,cy,rIn,0,2*Math.PI);
  ctx.fillStyle=cg;
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)';
  ctx.lineWidth=2.5;
  ctx.stroke();

  ctx.font='24px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('🍀',cx,cy);
}

function darken(hex,f){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}
function roundRectFallback(c,x,y,w,h,r){
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
}

drawWheel(0);

function startWheel(){
  document.getElementById('landing').style.display='none';
  const wv=document.getElementById('wheel-view');
  wv.style.display='flex';
}

function spin(){
  if(spinning)return;
  spinning=true;
  document.getElementById('spin-btn').disabled=true;
  const extra=(7+Math.floor(Math.random()*5))*2*Math.PI;
  const target=Math.random()*2*Math.PI;
  const total=extra+target;
  const dur=5000;
  const t0=performance.now();
  const a0=curAngle;
  function frame(now){
    const el=Math.min(now-t0,dur);
    const p=el/dur;
    const ease=1-Math.pow(1-p,4);
    drawWheel(a0+total*ease);
    if(el<dur){requestAnimationFrame(frame);}
    else{
      curAngle=(a0+total)%(2*Math.PI);
      drawWheel(curAngle);
      spinning=false;
      setTimeout(()=>showResult(curAngle),350);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(angle){
  const norm=(((-angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI));
  const idx=Math.floor(norm/arc)%n;
  const s=S[idx];
  document.getElementById('modal-emoji').textContent=s.emoji;
  document.getElementById('modal-sector').textContent=s.label;
  document.getElementById('modal-title').textContent=s.title;
  document.getElementById('modal-text').textContent=s.msg;
  document.getElementById('overlay').style.display='flex';
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('spin-btn').disabled=false;
}
</script>
